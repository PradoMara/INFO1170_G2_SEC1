<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Comentarios - Administrador</title>
    <link rel="stylesheet" href="comentarios.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="barra-superior">
        <img src="../Iconos/logo.png" alt="Logo" class="logo">
        <h1 class="titulo"><i class="fas fa-comments"></i> Gestión de Comentarios</h1>
    </header>

    <main class="container">
        <section class="comentarios-seccion">
            <h2><i class="fas fa-comment-alt"></i> Comentarios recientes</h2>
            <ul id="comentarios-lista">
                <!-- Aquí se cargarán dinámicamente los comentarios desde la base de datos -->
                <li>
                    <span class="comentario-autor"><i class="fas fa-user"></i> Autor del comentario</span>
                    <span class="comentario-fecha"><i class="fas fa-calendar-alt"></i> 01/01/2023</span>
                    <p class="comentario-texto">Este es un comentario de ejemplo.</p>
                </li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <a href="../Terminos_y_Condiciones/terminos_condiciones.html"><i class="fas fa-file-alt"></i> Términos y Condiciones</a> |
        <a href="../Politica_de_Privacidad/PoliticaDePrivacidad.html"><i class="fas fa-user-shield"></i> Política de Privacidad</a>
    </footer>

    <script src="comentarios.js"></script>
</body>
</html>
