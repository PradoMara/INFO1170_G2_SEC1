<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Empresa</title>
    <link rel="stylesheet" href="Validacion_Empresa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="barra-superior">
            <img src="logo.png" alt="Logo" class="logo">
            <h1><i class="fas fa-briefcase"></i> AraucaniaLaboral</h1>            
        </nav>
    </header>

    <div class="contenedor">
        <h2><i class="fas fa-building"></i> Validación de Empresa</h2>
        <form id="formularioValidacion" novalidate>
            <div class="grupo-input">
                <label for="razonSocial"><i class="fas fa-user-tie"></i> Razón Social</label>
                <input type="text" id="razonSocial" name="razonSocial" placeholder="Ingrese la razón social" required>
                <span class="mensaje-error" id="errorRazonSocial"></span>
            </div>

            <div class="grupo-input">
                <label for="registroTributario"><i class="fas fa-id-card"></i> Número de Registro Tributario (RUT)</label>
                <input type="text" id="registroTributario" name="registroTributario" placeholder="12345678-9" required>
                <span class="mensaje-error" id="errorRegistroTributario"></span>
            </div>

            <div class="grupo-input">
                <label for="direccionFiscal"><i class="fas fa-map-marker-alt"></i> Dirección Fiscal</label>
                <input type="text" id="direccionFiscal" name="direccionFiscal" placeholder="Ingrese la dirección fiscal" required>
                <span class="mensaje-error" id="errorDireccionFiscal"></span>
            </div>

            <div class="grupo-input">
                <label for="emailEmpresa"><i class="fas fa-envelope"></i> Correo Electrónico Corporativo</label>
                <input type="email" id="emailEmpresa" name="emailEmpresa" placeholder="correo@empresa.com" required>
                <span class="mensaje-error" id="errorEmailEmpresa"></span>
            </div>

            <button type="submit"><i class="fas fa-check"></i> Validar Empresa</button>
            <div id="mensaje" style="display:none;"></div> 
        </form>
    </div>

    <footer class="barra-contacto">
        <p><i class="fas fa-envelope"></i> Contacto: <a href="mailto:integracion58@gmail.com">integracion58@gmail.com</a> | 
        <i class="fas fa-phone-alt"></i> Teléfono: +56 9 9992 9342</p>
    </footer>

    <script src="Validacion_Empresa.js"></script>
</body>
</html>
