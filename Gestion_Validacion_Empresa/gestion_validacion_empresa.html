<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma laboral para conectar a empleadores y buscadores de empleo en la región de La Araucanía.">
    <title>Gestión de Validación de Empresas</title>
    <link rel="stylesheet" href="gestion_valiedacion_empresa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="barra-navegacion">
        <div class="contenedor-navegacion">
            <div class="logo-nombre">
                <img src="../Iconos/logo.png" alt="Logo Araucanía Laboral" class="logo">
                <span class="nombre-sitio">Araucanía Laboral</span>
            </div>
            <a href="/Pagina_Principal_Admin/Pagina_Admin.html" class="perfil-enlace">  
                <div class="perfil-usuario">
                    <i class="fas fa-user-circle icono-perfil"></i>
                    <span class="nombre-usuario">Administrador</span>
                </div>
            </a>
        </div>
    </nav>
    
    <div class="contenedor">
        <h1 class="texto-bienvenida"><i class="fas fa-building"></i> Solicitudes de Validación Pendientes</h1>
        <div class="filtros">
            <div class="input-icono">
                <i class="fas fa-search"></i>
                <input type="text" id="busqueda" class="filtro" placeholder="Buscar empresa...">
            </div>
            <div class="input-icono">
                <i class="fas fa-filter"></i>
                <select id="filtro-aceptado-rechazado" class="filtro">
                    <option value="">Filtrar por Aceptado o Rechazado</option>
                    <option value="aceptado">Aceptados</option>
                    <option value="rechazado">Rechazados</option>
                </select>
            </div>
            <div class="input-icono">
                <i class="fas fa-clock"></i>
                <select id="filtro-recientes" class="filtro">
                    <option value="">Filtrar por Recientes</option>
                    <option value="1">Última semana</option>
                    <option value="4">Último mes</option>
                    <option value="12">Último año</option>
                </select>
            </div>
            <div class="input-icono">
                <i class="fas fa-sort-alpha-down"></i>
                <select id="filtro-abecedario" class="filtro">
                    <option value="">Filtrar por Abecedario</option>
                    <option value="A-Z">A-Z</option>
                    <option value="Z-A">Z-A</option>
                </select>
            </div>
        </div>
        <div id="solicitudes-container">
        </div>
        <div id="paginacion" class="paginacion">
        </div>
    </div>

    <footer class="footer">
        <div id="copy">
            <p>&copy; 2024 Araucanía Laboral. Todos los derechos reservados.</p>
        </div>
    </footer>

    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-content">
          <p id="popupMessage">¿Estás seguro de que deseas realizar esta acción?</p>
          <div class="popup-buttons">
            <button id="confirmButton" class="popup-btn">Confirmar</button>
            <button id="cancelButton" class="popup-btn">Cancelar</button>
          </div>
        </div>
      </div>
    
      <script src="gestion_validacion_empresa.js"></script>
    </body>
    </html>
