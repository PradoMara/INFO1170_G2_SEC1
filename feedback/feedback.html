<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - AraucaniaLaboral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="feedback.css">
</head>
<body>
    <!-- Cabecera -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-briefcase"></i>
            <h1>AraucaniaLaboral</h1>
        </div>
        <div class="user-profile">
            <i class="fa-solid fa-user-circle icono-perfil"></i>
            <span>Bienvenido, Usuario</span>
        </div>
    </header>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <h1 class="text-center">¡Tu opinión nos importa!</h1>
        <p class="text-center">Califica tu experiencia y ayúdanos a mejorar nuestro servicio.</p>
        <form id="feedback-form" class="mt-4">
            <div class="mb-3">
                <label for="rating" class="form-label">Calificación (1-5):</label>
                <select class="form-select" id="rating" name="rating" required>
                    <option value="" disabled selected>Selecciona una calificación</option>
                    <option value="1">1 - Muy Mala</option>
                    <option value="2">2 - Mala</option>
                    <option value="3">3 - Regular</option>
                    <option value="4">4 - Buena</option>
                    <option value="5">5 - Excelente</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="comments" class="form-label">Comentarios:</label>
                <textarea class="form-control" id="comments" name="comments" rows="4" placeholder="Escribe tus comentarios..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-paper-plane"></i> Enviar Feedback
            </button>
        </form>
    </div>

    <!-- Popup de confirmación -->
    <div id="popup" class="popup-overlay">
        <div class="popup-content">
            <p id="popup-message"></p>
            <div class="popup-buttons">
                <button class="popup-btn" onclick="closePopup()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="feedback.js"></script>
</body>
</html>
