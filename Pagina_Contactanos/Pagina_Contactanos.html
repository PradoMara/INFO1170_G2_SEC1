<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - AraucaniaLaboral</title>
    <link rel="stylesheet" href="Pagina_Contactanos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="barra-superior">
        <img src="logo.png" alt="Logo" class="logo">
        <h1 class="sitio-titulo"><i class="fas fa-envelope"></i> AraucaniaLaboral - Contáctanos</h1>
    </header>

    <main class="contenedor-contacto">
        <h2><i class="fas fa-address-card"></i> Contáctanos</h2>
        <p><i class="fas fa-info-circle"></i> Si tienes alguna duda o consulta, no dudes en enviarnos un mensaje.</p>

        <form id="form-contacto" action="#" method="post">
            <div class="grupo-input">
                <label for="nombre"><i class="fas fa-user"></i> Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <small id="error-nombre" class="mensaje-error"><i class="fas fa-exclamation-circle"></i> Ingresa tu nombre.</small>
            </div>

            <div class="grupo-input">
                <label for="correo"><i class="fas fa-envelope"></i> Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>
                <small id="error-correo" class="mensaje-error"><i class="fas fa-exclamation-circle"></i> Ingresa un correo válido.</small>
            </div>

            <div class="grupo-input">
                <label for="mensaje"><i class="fas fa-comment"></i> Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" maxlength="500" required></textarea>
                <small id="contador-caracteres"><i class="fas fa-pencil-alt"></i> 0/500 caracteres</small>
                <small id="error-mensaje" class="mensaje-error"><i class="fas fa-exclamation-circle"></i> Ingresa un mensaje.</small>
            </div>

            <button type="submit"><i class="fas fa-paper-plane"></i> Enviar Mensaje</button>
            <p id="resultado-mensaje"></p>
        </form>
    </main>

    <footer class="barra-contacto">
        <p><i class="fas fa-envelope"></i> Contacto: <a href="mailto:integracion58@gmail.com">integracion58@gmail.com</a> | <i class="fas fa-phone"></i> Teléfono: +56 9 9992 9342</p>
    </footer>

    <script src="Pagina_Contactanos.js"></script>
</body>
</html>
