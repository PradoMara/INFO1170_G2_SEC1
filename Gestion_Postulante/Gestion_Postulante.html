<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Postulantes - Araucanía Laboral</title>
    <link rel="stylesheet" href="Gestion_Postulante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="barra-navegacion">
        <div class="contenedor-navegacion">
            <div class="logo-nombre">
                <img src="../Iconos/logo.png" alt="Logo Araucanía Laboral" class="logo">
                <span class="nombre-sitio">Araucanía Laboral</span>
            </div>
            <a href="../Perfil_Admin/Perfil_Admin.html" class="perfil-enlace">  
                <div class="perfil-usuario">
                    <i class="fas fa-user-circle icono-perfil"></i>
                    <span class="nombre-usuario">Administrador</span>
                </div>
            </a>
        </div>
    </nav>

    <div class="contenedor">
        <h1 class="texto-bienvenida"><i class="fas fa-users"></i> Gestión de Postulantes</h1>

        <div class="filtros">
            <div class="input-icono">
                <i class="fas fa-search"></i>
                <input type="text" id="busqueda" class="filtro" placeholder="Buscar postulante...">
            </div>
            <div class="input-icono">
                <i class="fas fa-filter"></i>
                <select id="filtro-edad" class="filtro">
                    <option value="">Filtrar por Edad</option>
                    <option value="15-18">15-18 años</option>
                    <option value="18-25">18-25 años</option>
                    <option value="26-35">26-35 años</option>
                    <option value="36-45">36-45 años</option>
                    <option value="46-60">46-60 años</option>
                    <option value="60+">Más de 60 años</option>
                </select>
            </div>
            <div class="input-icono">
                <i class="fas fa-clock"></i>
                <select id="filtro-recientes" class="filtro">
                    <option value="">Filtrar por Recientes</option>
                    <option value="1">Última semana</option>
                    <option value="4">Último mes</option>
                    <option value="12">Último año</option>
                </select>
            </div>
            <div class="input-icono">
                <i class="fas fa-sort-alpha-down"></i>
                <select id="filtro-abecedario" class="filtro">
                    <option value="">Filtrar por Abecedario</option>
                    <option value="A-Z">A-Z</option>
                    <option value="Z-A">Z-A</option>
                </select>
            </div>
        </div>

        <div class="lista-postulantes" id="lista-postulantes">
            <div class="postulante" data-fecha="2023-09-10" data-edad="30">
                <i class="fas fa-user-circle foto-postulante"></i>
                <div class="info-postulante">
                    <h3 class="nombre-postulante">Juan Pérez</h3>
                    <p class="detalle-postulante"><i class="fas fa-envelope"></i> Email: juan.perez@example.com</p>
                    <p class="detalle-postulante"><i class="fas fa-phone"></i> Teléfono: +56 9 1234 5678</p>
                    <p class="detalle-postulante"><i class="fas fa-birthday-cake"></i> Edad: 30 años</p>
                </div>
                <div class="acciones-postulante">
                    <button class="btn" onclick="verDetalles('Juan Pérez')"><i class="fas fa-eye"></i> Ver Detalles</button>
                    <button class="btn" onclick="editarPostulante('Juan Pérez')"><i class="fas fa-edit"></i> Editar</button>
                </div>
            </div>
            <div class="postulante" data-fecha="2024-18-9" data-edad="17">
                <i class="fas fa-user-circle foto-postulante"></i>
                <div class="info-postulante">
                    <h3 class="nombre-postulante">Ana Gómez</h3>
                    <p class="detalle-postulante"><i class="fas fa-envelope"></i> Email: ana.gomez@example.com</p>
                    <p class="detalle-postulante"><i class="fas fa-phone"></i> Teléfono: +56 9 2345 6789</p>
                    <p class="detalle-postulante"><i class="fas fa-birthday-cake"></i> Edad: 17 años</p>
                </div>
                <div class="acciones-postulante">
                    <button class="btn" onclick="verDetalles('Ana Gómez')"><i class="fas fa-eye"></i> Ver Detalles</button>
                    <button class="btn" onclick="editarPostulante('Ana Gómez')"><i class="fas fa-edit"></i> Editar</button>
                </div>
            </div>
        </div>

        <div class="boton-volver">
            <button id="btn-volver" class="btn"><i class="fas fa-arrow-left"></i> Volver a la Página Principal</button>
        </div>
    </div>
    
    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-content">
          <p id="popupMessage">¿Estás seguro de que deseas realizar esta acción?</p>
          <div class="popup-buttons">
            <button id="confirmButton" class="popup-btn">Confirmar</button>
            <button id="cancelButton" class="popup-btn">Cancelar</button>
          </div>
        </div>
      </div>
    
      <script src="Gestion_Postulante.js"></script>
    </body>
    </html>
