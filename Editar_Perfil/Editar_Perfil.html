<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - Araucanía Laboral</title>
    <link rel="stylesheet" href="Editar_Perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="barra-navegacion">
        <div class="contenedor-navegacion">
            <div class="logo-nombre">
                <img src="img/logo.png" alt="Logo Araucanía Laboral" class="logo">
                <span class="nombre-sitio">Araucanía Laboral</span>
            </div>
            <div class="perfil-usuario">
                <i class="fas fa-user-circle icono-perfil"></i>
                <span class="nombre-usuario" id="nombre-usuario"></span>
            </div>
        </div>
    </nav>

    <div class="contenedor-editar-perfil">
        <h2>Editar Perfil</h2>
        <form id="form-editar-perfil">
            <div class="campo">
                <label for="nombre">Nombre Completo</label>
                <div class="input-icono">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
            </div>
            <div class="campo">
                <label for="correo">Correo Electrónico</label>
                <div class="input-icono">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="correo" name="correo" required>
                </div>
            </div>
            <div class="campo">
                <label for="telefono">Teléfono</label>
                <div class="input-icono">
                    <i class="fas fa-phone"></i>
                    <input type="text" id="telefono" name="telefono">
                </div>
            </div>
            <div class="campo">
                <label for="acerca_de">Acerca de mí</label>
                <div class="input-icono">
                    <i class="fas fa-info-circle"></i>
                    <textarea id="acerca_de" name="acerca_de"></textarea>
                </div>
            </div>
            <div class="campo">
                <label for="experiencia">Experiencia</label>
                <div class="input-icono">
                    <i class="fas fa-briefcase"></i>
                    <textarea id="experiencia" name="experiencia"></textarea>
                </div>
            </div>
            <div class="campo">
                <label for="educacion">Educación</label>
                <div class="input-icono">
                    <i class="fas fa-graduation-cap"></i>
                    <textarea id="educacion" name="educacion"></textarea>
                </div>
            </div>
            <div class="acciones-formulario">
                <button type="submit" class="btn-guardar">Guardar</button>
                <button type="button" class="btn-cancelar">Cancelar</button>
            </div>
        </form>
    </div>

    <script src="Editar_Perfil.js"></script>
</body>
</html>
