<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Consultas - Araucanía Laboral</title>
  <link rel="stylesheet" href="gestionDudasConsultas.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="../Iconos/logo.png" alt="Araucanía Laboral">
      <h1>Araucanía Laboral</h1>
    </div>
    <div class="user-profile">
      <i class="fas fa-user-circle icono-perfil"></i>
      <span>Administrador</span>
    </div>
  </header>
  
  <main>
    <section class="gestion-consultas">
      <h2>Gestión de Consultas</h2>

      <div class="search-filter">
        <div class="input-icono">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Buscar consulta...">
        </div>
        <div class="input-icono">
          <i class="fas fa-filter"></i>
          <select>
            <option>Filtrar por Recientes</option>
            <option>Filtrar por Respondidas</option>
            <option>Filtrar por Pendientes</option>
          </select>
        </div>
      </div>

      <div class="consulta-lista">
      </div>

      <div class="back-button">
        <button onclick="window.location.href='../Portada_AraucaniaLaboral/portada.html';">
          <i class="fas fa-arrow-left"></i> Volver a Página Principal
        </button>
      </div>
    </section>
  </main>

  <script src="gestionDudasConsultas.js"></script>
</body>
</html>
