<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil de usuario para menores de edad en la plataforma laboral.">
    <title>Perfil de Usuario - Menor de Edad</title>
    <link rel="stylesheet" href="EstilosDelPerfilMenorDeEdad.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <img src="../Iconos/logo.png" alt="Logo de la plataforma">
        </div>
        <nav class="nav-links">
            <a href="../Portada_AraucaniaLaboral/portada.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="../Pagina_Principal_Menor_de_Edad/PaginaPrincipalMenoresDeEdad.html"><i class="fas fa-briefcase"></i> Ofertas de Trabajo</a>
            <a href="../Notificaciones_Postulante/notificaciones.html"><i class="fas fa-bell"></i> Notificaciones</a>
        </nav>
    </header>

    <section class="profile-section">
        <div class="profile-header">
            <div class="profile-image">
                <img src="../Iconos/Perfil-Icono.png" alt="Imagen de perfil del usuario" class="profile-picture"> 
            </div>
            <div class="profile-info">
                <h1><input type="text" id="nombre" placeholder="Nombre" disabled></h1>
                <p><i class="fas fa-birthday-cake"></i> Edad: <input type="number" id="edad" placeholder="Edad" disabled></p>
                <p><i class="fas fa-map-marker-alt"></i> Ubicación: <input type="text" id="ubicacion" placeholder="Ubicación" disabled></p>
                <button class="edit-button" id="editButton"><i class="fas fa-edit"></i> Editar Perfil</button>
                <button class="save-button" id="saveButton" style="display:none;"><i class="fas fa-save"></i> Guardar Cambios</button>
            </div>
        </div>
    </section>

    <main class="profile-details">
        <section class="about">
            <h2><i class="fas fa-info-circle"></i> Acerca de mí</h2>
            <textarea id="acerca_de_mi" placeholder="Escribe algo sobre ti..." disabled></textarea>
        </section>

        <section class="skills">
            <h2><i class="fas fa-tools"></i> Habilidades</h2>
            <textarea id="habilidades" placeholder="Escribe tus habilidades..." disabled></textarea>
        </section>

        <section class="experience">
            <h2><i class="fas fa-briefcase"></i> Experiencia</h2>
            <textarea id="experiencia" placeholder="Escribe tu experiencia laboral..." disabled></textarea>
        </section>

        <section class="education">
            <h2><i class="fas fa-graduation-cap"></i> Educación</h2>
            <textarea id="educacion" placeholder="Escribe tu educación..." disabled></textarea>
        </section>

        <section class="activities">
            <h2><i class="fas fa-running"></i> Actividades Extracurriculares</h2>
            <textarea id="actividades_extracurriculares" placeholder="Escribe tus actividades extracurriculares..." disabled></textarea>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <a href="contacto.html"><i class="fas fa-envelope"></i> Contáctenos</a> | 
            <a href="../Terminos_y_Condiciones/terminos_condiciones.html"><i class="fas fa-file-contract"></i> Términos y condiciones</a>
        </div>
    </footer>

    <script src="perfilMenorDeEdad.js"></script>
</body>
</html>
