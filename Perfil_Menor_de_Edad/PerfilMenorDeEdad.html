<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil de usuario para menores de edad en la plataforma laboral.">
    <title>Perfil de Usuario - Menor de Edad</title>
    <link rel="stylesheet" href="EstilosDelPerfilMenorDeEdad.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome -->
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <img src="../Iconos/logo.png" alt="Logo de la plataforma">
        </div>
        <nav class="nav-links">
            <a href="../Portada_AraucaniaLaboral/portada.html">
                <i class="fas fa-home"></i> Inicio
            </a>
            <a href="../Pagina_Principal_Menor_de_Edad/PaginaPrincipalMenoresDeEdad.html">
                <i class="fas fa-briefcase"></i> Ofertas de Trabajo
            </a>
            <a href="../Notificaciones_Postulante/notificaciones.html">
                <i class="fas fa-bell"></i> Notificaciones
            </a>
        </nav>
    </header>
    

    <section class="profile-section">
        <div class="profile-header">
            <div class="profile-image">
                <img src="../Iconos/Perfil-Icono.png" alt="Imagen de perfil del usuario" class="profile-picture"> 
            </div>
            <div class="profile-info">
                <label for="nombre"><i class="fas fa-user"></i> Nombre:</label>
                <input type="text" id="nombre" disabled>
                
                <label for="edad"><i class="fas fa-calendar-alt"></i> Edad:</label>
                <input type="number" id="edad" disabled>
                
                <label for="ubicacion"><i class="fas fa-map-marker-alt"></i> Ubicación:</label>
                <input type="text" id="ubicacion" disabled>
                
                <button class="edit-button" id="editButton">
                    <i class="fas fa-edit"></i> Editar Perfil
                </button>
                <button class="save-button" id="saveButton" style="display:none;">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </section>

    <main class="profile-details">
        <section class="about">
            <h2>Acerca de mí</h2>
            <textarea id="acerca_de_mi" disabled></textarea>
        </section>

        <section class="skills">
            <h2>Habilidades</h2>
            <textarea id="habilidades" disabled></textarea>
        </section>

        <section class="experience">
            <h2>Experiencia</h2>
            <textarea id="experiencia" disabled></textarea>
        </section>

        <section class="education">
            <h2>Educación</h2>
            <textarea id="educacion" disabled></textarea>
        </section>

        <section class="activities">
            <h2>Actividades Extracurriculares</h2>
            <textarea id="actividades_extracurriculares" disabled></textarea>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <a href="../Pagina_Contactanos/Pagina_Contactanos.html">Contáctenos</a> | 
            <a href="../Terminos_y_Condiciones/terminos_condiciones.html">Términos y condiciones</a>
        </div>
    </footer>

    <script src="perfilMenorDeEdad.js"></script>
</body>
</html>
