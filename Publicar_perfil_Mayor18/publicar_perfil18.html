<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmación de la publicación del perfil.">
    <title>Perfil Publicado</title>
    <link rel="stylesheet" href="publicar_perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <img src="../Iconos/logo.png" alt="Logo de la plataforma">
        </div>
        <nav class="nav-links">
            <a href="../Portada_AraucaniaLaboral/portada.html"><i class="fas fa-home"></i> Inicio</a>
            <a href="../Pagina_Principal_Menor_de_Edad/PaginaPrincipalMenoresDeEdad.html"><i class="fas fa-briefcase"></i> Ofertas de Trabajo</a>
            <a href="../Notificaciones_Postulante/notificaciones.html"><i class="fas fa-bell"></i> Notificaciones</a>
        </nav>
    </header>

    <main class="profile-published">
        <form class="upload-cv-form">
            <h1>Ahora puedes subir tu currículum en formato PDF o imagen.</h1>
            <div class="file-input-container">
                <label for="cvUpload"><i class="fas fa-upload"></i> Sube tu CV:</label>
                <input type="file" id="cvUpload" accept=".pdf,.png,.jpg,.jpeg">
                <button type="submit" id="submitBtn"><i class="fas fa-cloud-upload-alt"></i> Subir CV</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-content">
            <a href="contacto.html"><i class="fas fa-envelope"></i> Contáctenos</a> | 
            <a href="../Terminos_y_Condiciones/terminos_condiciones.html"><i class="fas fa-file-alt"></i> Términos y condiciones</a>
        </div>
    </footer>
    <script src="publicar_perfil.js"></script>
</body>
</html>
