<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Validaciones</title>
    <link rel="stylesheet" href="Gestion_Validacion_Postulante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <h1>Araucanía Laboral</h1>
            <p>Gestión de Validaciones</p>
        </nav>
    </header>
    <main>
        <div class="contenedor-busqueda">
            <input type="text" placeholder="Buscar validación..." id="buscar">
            <button id="filtro-recientes">Filtrar por Recientes</button>
        </div>
        <div id="contenedor-tarjetas" class="contenedor-tarjetas">
        </div>
    </main>
    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-content">
          <p id="popupMessage">¿Estás seguro de que deseas realizar esta acción?</p>
          <div class="popup-buttons">
            <button id="confirmButton" class="popup-btn">Confirmar</button>
            <button id="cancelButton" class="popup-btn">Cancelar</button>
          </div>
        </div>
      </div>
    
    <script src="Gestion_Validacion_Postulante.js"></script>
</body>
</html>
