<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Postulante</title>
    <link rel="stylesheet" href="registro.css">
    <script defer src="registro.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="nav-bar">
            <div class="logo">ArucaniaLaboral</div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Registro de Postulante</h2>
            <form id="register-form" action="/register" method="POST" enctype="multipart/form-data">
                
                <!-- Nombre Completo -->
                <div class="input-group">
                    <label for="name">Nombre Completo</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>

                <!-- Correo Electrónico -->
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <!-- Número de Teléfono -->
                <div class="input-group">
                    <label for="phone">Número de Teléfono</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Ej. +56912345678" required>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="********" required>
                    </div>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="input-group">
                    <label for="confirm_password">Confirmar Contraseña</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="********" required>
                    </div>
                </div>

                <!-- Aceptar términos -->
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Acepto los <a href="#">términos y condiciones</a></label>
                </div>
                
                <!-- Mensaje de error -->
                <p id="error-message" class="error-message"></p>

                <!-- Botón -->
                <button type="submit" id="submit-btn">Registrarse</button>

                <div class="login-link">
                    <p>O <a href="login.html">inicia sesión</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="contact-bar">
            <a href="#">Contáctanos</a>
            <a href="#">Términos y condiciones</a>
        </div>
    </footer>
</body>
</html>
