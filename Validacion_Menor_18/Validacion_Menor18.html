<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación Menor de 18 Años</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Validacion_Menor18.css">
</head>
<body>
    <div class="barra-superior">
        <img src="logo.png" alt="Logo" class="logo">
        <h1>Validación </h1>
    </div>
    <div class="contenedor">
        <h2>Formulario de Validación</h2>

        <form id="formValidacion" enctype="multipart/form-data">
            <div class="grupo-input">
                <label for="fecha_nacimiento"><i class="fas fa-calendar-alt"></i> Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="grupo-input">
                <label for="archivo"><i class="fas fa-file-upload"></i> Imagen de cedula de identidad:</label>
                <input type="file" id="archivo" name="archivo" accept="image/*,application/pdf" required>
                <!-- Vista previa del archivo seleccionado -->
                <div id="vistaPreviaArchivo" class="vista-previa"></div>
            </div>

            <div class="grupo-input">
                <label for="permiso"><i class="fas fa-handshake"></i> Documento de permiso legal:</label>
                <input type="file" id="permiso" name="permiso" accept="image/*,application/pdf" required>
                <div id="vistaPreviaPermiso" class="vista-previa"></div>
            </div>

            <button type="submit">
                <i class="fas fa-paper-plane"></i> Enviar Validación
            </button>
        </form>

        <div class="mensaje-error" id="respuesta"></div>
    </div>

    <div class="barra-contacto">
        <p>¿Necesitas ayuda? <a href="#">Contáctanos</a></p>
    </div>

    <script src="Validacion_Menor18.js"></script>
</body>
</html>
