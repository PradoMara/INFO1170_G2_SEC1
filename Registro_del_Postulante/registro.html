<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Postulante</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer src="scripts.js"></script>
</head>
<body>
    <header>
        <nav class="nav-bar">
            <img src="../Iconos/logo.png" alt="Logo Empresa" class="logo">
            <h1><i class="fas fa-briefcase"></i> AraucaniaLaboral</h1>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2><i class="fas fa-user-plus"></i> Registro de Postulante</h2>
            <form id="register-form"> 
                <label for="name"><i class="fas fa-user"></i> Nombre Completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre completo" required>
                
                <label for="email"><i class="fas fa-envelope"></i> Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
    
                <label for="phone"><i class="fas fa-phone"></i> Número de Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="+56 9 1234 5678">
                
                <label for="age"><i class="fas fa-birthday-cake"></i> Edad</label>
                <input type="number" id="age" name="age" min="16" placeholder="Tu edad" required>
    
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Contraseña segura" required>
                
                <label for="confirm_password"><i class="fas fa-lock"></i> Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                
                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms"><i class="fas fa-check-square"></i> Acepto los <a href="../Terminos_y_Condiciones/terminos_condiciones.html">términos y condiciones</a></label>
                </div>
                
                <!-- Mensaje de error o éxito -->
                <p id="error-message" class="error-message" style="display:none; color: red;"></p>
                <p id="success-message" class="success-message" style="display:none; color: green;"></p>

                <div class="enlaces-ayuda">
                    <p><i class="fas fa-sign-in-alt"></i> <a href="../Inicio_Sesion_Postulante/Inicio_Sesion_Postulante.html">¿Ya tienes cuenta? Inicia Sesión</a></p>
                </div>
    
                <button type="submit" id="submit-btn"><i class="fas fa-user-check"></i> Registrarse</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="contact-bar">
            <a href="#"><i class="fas fa-envelope"></i> Contáctanos</a>
            <a href="../Terminos_y_Condiciones/terminos_condiciones.html"><i class="fas fa-file-alt"></i> Términos y condiciones</a>
        </div>
    </footer>
</body>
</html>
